[server]
maxUploadSize = 5

[client]
toolbarMode = "minimal"

[theme]
font = "sans serif"

[theme.light]
primaryColor    = "#4E5947"
backgroundColor = "#F6F3ED"
secondaryBackgroundColor = "#EEEAE2"
textColor       = "#292923"
borderColor     = "#E3DED5"
dataframeBorderColor = "#E3DED5"

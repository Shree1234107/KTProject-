backgroundColor = "#1C1D19"
secondaryBackgroundColor = "#2E302A"
textColor       = "#ECE9E1"
borderColor     = "#3A3C35"
dataframeBorderColor = "#3A3C35"
dataframeHeaderBackgroundColor = "#252621"
